name: Deploy EcoSort Edge to Docker Hub

on:
  push:
    branches: ["main"]
    paths:
      - "edge/**" # only if /edge got changes

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Configure ARM Emulator (QEMU)
        uses: docker/setup-qemu-action@v3

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login on Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./edge # Where code and Dockerfile are
          file: ./edge/Dockerfile # Dockerfile path
          push: true # Send to cloud after compile
          platforms: linux/arm64 # Compile to Raspberry Pi architecture
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ecosort-edge:latest
