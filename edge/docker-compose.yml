version: "3.8"
services:
  ecosort-edge:
    build: .
    restart: always
    stdin_open: true
    tty: true
    network_mode: "host"
    privileged: true
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ~/.Xauthority:/root/.Xauthority:ro
      - ./:/app
    devices:
      - "/dev/video0:/dev/video0"
    environment:
      - API_URL=https://ecosort-ai-nine.vercel.app/api/v1/trash-events
      - BIN_ID=smart_bin_01
      - CAMERA_SOURCE=0
      - DISPLAY=:0
      - XAUTHORITY=/root/.Xauthority
